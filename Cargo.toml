[workspace]
resolver = "2"
members = ["engine", "input", "hotkeys", "player", "preview_synth", "gui", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
midly = "0.5"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
ashpd = { version = "0.13", features = ["global_shortcuts"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
cxx-qt-build = "0.10"
rustysynth = "1.3"
rodio = "0.22"

# Vendored rustysynth with a lenient SF2 parser: it skips unknown INFO chunks
# (including nested LISTs) and treats degenerate loop points as no-loop, so it
# can load oddly-authored fonts like ACCURATE_SF2_AiX_CTX800.SF2.
[patch.crates-io]
rustysynth = { path = "vendor/rustysynth" }
