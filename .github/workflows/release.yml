name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build GUI
        run: cargo build --release -p wwm-gui

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="wwm-midi-player-linux-${VERSION}-x86_64"
          mkdir -p "dist/${PKG}"
          cp target/release/wwm-gui "dist/${PKG}/"
          cp -r soundfonts "dist/${PKG}/"
          # Never ship fonts that cannot be redistributed (see .gitignore).
          rm -f "dist/${PKG}/soundfonts/ACCURATE_SF2_AiX_CTX800.SF2" \
                "dist/${PKG}/soundfonts/DSK Asian DreamZ.SF2"
          cp LICENSE README.md CLI.md "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
